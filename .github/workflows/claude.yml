# Anthropic's standard @claude workflow:
# https://github.com/anthropics/claude-code-action/blob/main/examples/claude.yml
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # The repository is public, so only the owner, members, and collaborators can
    # start Claude. Anyone else's mention does not run on the API key.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # This job has write access and the API key, so Claude must only read content
      # from people with write access. A fork's pull request or an outsider's issue
      # could carry a prompt injection.
      - name: Refuse content from outside contributors
        env:
          GH_TOKEN: ${{ github.token }}
          CLOAKMILL_ACTOR: ${{ github.actor }}
          CLOAKMILL_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          thread=$(gh api "repos/$GITHUB_REPOSITORY/issues/$CLOAKMILL_NUMBER")
          author=$(jq -r '.user.login' <<< "$thread")
          for user in "$CLOAKMILL_ACTOR" "$author"; do
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$user/permission" --jq '.permission' 2> /dev/null || echo none)
            if [ "$permission" != "admin" ] && [ "$permission" != "write" ]; then
              echo "::error::Claude only runs for people with write access, on threads they wrote."
              exit 1
            fi
          done
          if jq -e 'has("pull_request")' <<< "$thread" > /dev/null; then
            head_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$CLOAKMILL_NUMBER" --jq '.head.repo.full_name // ""')
            if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::Claude does not run on fork pull requests. Review this one by hand."
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude only reads comments from these accounts. Add collaborators here.
          include_comments_by_actor: "${{ github.repository_owner }},claude[bot],github-actions[bot]"
