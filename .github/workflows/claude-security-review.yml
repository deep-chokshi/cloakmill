# Anthropic's standard Claude Code security review workflow:
# https://github.com/anthropics/claude-code-security-review#quick-start
name: Claude Security Review

on:
  pull_request:

permissions:
  pull-requests: write # Needed for leaving PR comments
  contents: read

jobs:
  security:
    # Dependabot and fork runs get no repository secrets, so the review cannot run.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      # The action has no release tags; this pins main as of 2026-02-11.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The action's default, Claude Opus 4.1, retired on 2026-08-05. The action
          # sets up Node 18, so npm installs Claude Code 2.1.197, which rejects Opus
          # 5.5 (it needs Claude Code 2.1.280 or newer). Opus 5 is the newest it runs.
          claude-model: claude-opus-5
          # Scan every push. Without this, a PR is scanned once and a failed first
          # scan blocks later ones. Findings already posted are not repeated.
          run-every-commit: true
          # Must be absolute. The action resolves relative paths from its own folder.
          custom-security-scan-instructions: ${{ github.workspace }}/.github/security-review-notes.txt

      # The action posts nothing once a PR has any security comment, so keep one comment
      # up to date with the latest scan.
      - name: Post the latest findings on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CLOAKMILL_PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOAKMILL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -e 'type == "object" and (has("error") | not)' claudecode-results.json > /dev/null 2>&1 || exit 0
          marker='<!-- claude-security-findings -->'
          count=$(jq '(.findings // []) | length' claudecode-results.json)
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$CLOAKMILL_PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -1)
          if [ "$count" -eq 0 ] && [ -z "$comment_id" ]; then
            exit 0
          fi
          {
            echo "$marker"
            echo "## Security review"
            echo
            echo "Latest scan of \`$CLOAKMILL_HEAD_SHA\`: $count finding(s)."
            jq -r '.findings // [] | .[] | "\n### \(.severity) in `\(.file):\(.line)`\n\n**\(.category)**: \(.description)\n\n**Exploit scenario:** \(.exploit_scenario)\n\n**Recommendation:** \(.recommendation)"' claudecode-results.json | sed 's/@/@\xe2\x80\x8b/g'
          } > security-comment.md
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@security-comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$CLOAKMILL_PR_NUMBER/comments" -F body=@security-comment.md > /dev/null
          fi

      # The action reports success when its scan fails, so the result file decides.
      - name: Fail when the scan did not complete or found something
        run: |
          if ! jq -e 'type == "object" and (has("error") | not)' claudecode-results.json > /dev/null 2>&1; then
            echo "::error::The security scan did not complete. See the security-review-results artifact."
            exit 1
          fi
          if ! jq -e '(.findings // []) | length == 0' claudecode-results.json > /dev/null; then
            jq -r '.findings[] | "::error::\(.severity) \(.category) in \(.file)"' claudecode-results.json
            echo "::error::The security scan has findings. See the security-review-results artifact."
            exit 1
          fi
