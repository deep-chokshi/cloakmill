# Anthropic's standard Claude Code security review workflow:
# https://github.com/anthropics/claude-code-security-review#quick-start
name: Claude Security Review

on:
  pull_request:

permissions:
  pull-requests: write # Needed for leaving PR comments
  contents: read

jobs:
  security:
    # Dependabot and fork runs get no repository secrets, so the review cannot run.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      # The action has no release tags; this pins main as of 2026-02-11.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The action's default, Claude Opus 4.1, retired on 2026-08-05. The action
          # sets up Node 18, so npm installs Claude Code 2.1.197, which rejects Opus
          # 5.5 (it needs Claude Code 2.1.280 or newer). Opus 5 is the newest it runs.
          claude-model: claude-opus-5
          # Scan every push. Without this, a PR is scanned once and a failed first
          # scan blocks later ones. Findings already posted are not repeated.
          run-every-commit: true

      # The action reports success when its scan fails, and it posts nothing new once
      # a PR has any security comment, so the result file is the source of truth.
      - name: Fail when the scan did not complete or found something
        run: |
          if ! jq -e 'type == "object" and (has("error") | not)' claudecode-results.json > /dev/null 2>&1; then
            echo "::error::The security scan did not complete. See the security-review-results artifact."
            exit 1
          fi
          if ! jq -e '(.findings // []) | length == 0' claudecode-results.json > /dev/null; then
            jq -r '.findings[] | "::error::\(.severity) \(.category) in \(.file)"' claudecode-results.json
            echo "::error::The security scan has findings. See the security-review-results artifact."
            exit 1
          fi
