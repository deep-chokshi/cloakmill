name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Next.js workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/review-ui
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: apps/review-ui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types, lint and behavioral contracts
        run: npm run check
      - name: Check runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Build the standalone app
        run: npm run build
      - name: Install Chromium
        run: npm exec playwright install --with-deps chromium
      - name: Verify browser behavior and response boundaries
        run: npm run test:e2e
      - name: Verify the default disconnected mode
        run: npm run test:disconnected

  prototype:
    name: Prototype workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify sample workflow behavior
        run: node --test prototypes/workspace/model.test.mjs
      - name: Check JavaScript module syntax
        run: |
          for module in prototypes/workspace/*.mjs; do
            node --check "$module"
          done

  foundation:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development environment
        run: uv sync --locked --python "${{ matrix.python }}"
      - name: Check lint
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Verify wheel in a clean environment
        env:
          CLOAKMILL_WHEEL_ENV: ${{ runner.temp }}/cloakmill-wheel
        run: |
          uv venv "$CLOAKMILL_WHEEL_ENV" --python "${{ matrix.python }}"
          uv pip install --python "$CLOAKMILL_WHEEL_ENV/bin/python" --no-index dist/*.whl
          cd "$RUNNER_TEMP"
          "$CLOAKMILL_WHEEL_ENV/bin/python" -c 'import cloakmill; print(cloakmill.__version__)'
