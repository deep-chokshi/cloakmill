<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">CloakMill — Keep the context. Change the identity.</title>
  <desc id="desc">A dark green product banner with a connected identity illustration. CloakMill is an open-source project for offline enterprise-data pseudonymization.</desc>
  <defs>
